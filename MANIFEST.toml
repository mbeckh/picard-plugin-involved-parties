long_description = """Additional metadata for composers, lyricists, writers and producers.

The plugin adds the following metadata variables for each track if the respective data is available:

* _aipd_composer_id
* _aipd_composer_legal
* _aipd_lyricist_id
* _aipd_lyricist_legal
* _aipd_producer_id
* _aipd_producer_legal
* _aipd_writer_id
* _aipd_writer_legal

Please note that the plugin makes additional API calls to the MusicBrainz
database and might therefore slow down retrieval. An internal memory cache is
used for the lookup of legal names.

"""
